<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nuestra Aventura de Aniversario 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa-claro:#ffe3ea; --rosa:#f7a8be; --rosa-fuerte:#ec6f94;
    --vino:#7b1e3a; --vino-oscuro:#4a1024; --crema:#fff7f4;
    --sombra:0 14px 40px rgba(123,30,58,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Playfair Display',Georgia,serif;
    color:var(--vino-oscuro);
    background:radial-gradient(circle at 20% 10%,#ffd1de 0%,transparent 45%),
               radial-gradient(circle at 85% 90%,#e8809f 0%,transparent 45%),
               linear-gradient(160deg,#ffe3ea,#f3a6bd 55%,#b9475f);
    background-attachment:fixed;
    min-height:100dvh; overflow:hidden; touch-action:manipulation;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .bg-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg-hearts span{position:absolute;bottom:-40px;opacity:.35;animation:subir linear infinite}
  @keyframes subir{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

  #sound-btn{
    position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:50;
    width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(123,30,58,.3);
    font-size:22px;display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);transition:transform .15s;
  }
  #sound-btn:active{transform:scale(.9)}

  .card-main{
    position:relative;z-index:1;width:100%;max-width:420px;
    background:linear-gradient(180deg,#fffafa,var(--crema));
    border-radius:32px;box-shadow:var(--sombra);
    padding:26px 20px 24px;text-align:center;
    animation:flotar 5s ease-in-out infinite;
    border:2px solid rgba(255,255,255,.7);
  }
  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .screen{display:none;animation:aparecer .5s ease}
  .screen.active{display:block}
  @keyframes aparecer{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

  h1{font-family:'Dancing Script',cursive;font-size:clamp(2.2rem,10vw,3rem);color:var(--vino);line-height:1.1;margin:8px 0 14px}
  h2{font-family:'Dancing Script',cursive;font-size:2rem;color:var(--vino)}
  .sub{font-style:italic;font-size:1.05rem;color:#8d3a55;margin-bottom:24px;line-height:1.4}
  .big-emoji{font-size:3.4rem;animation:latido 1.4s infinite}
  @keyframes latido{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}

  .btn{
    font-family:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;border:none;
    padding:15px 28px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,var(--rosa-fuerte),var(--vino));
    box-shadow:0 10px 24px rgba(123,30,58,.35);transition:transform .15s,box-shadow .15s;
  }
  .btn:active{transform:scale(.95)}
  .btn.pulse{animation:pulso 1.8s infinite}
  @keyframes pulso{0%,100%{box-shadow:0 10px 24px rgba(123,30,58,.35),0 0 0 0 rgba(236,111,148,.6)}
                   50%{box-shadow:0 10px 24px rgba(123,30,58,.35),0 0 0 16px rgba(236,111,148,0)}}

  .level-tag{display:inline-block;background:var(--rosa-claro);color:var(--vino);padding:5px 14px;border-radius:999px;font-size:.85rem;font-weight:700;margin-bottom:6px}
  .progress{font-size:.9rem;color:#8d3a55;margin-bottom:10px}

  .stack{position:relative;width:100%;aspect-ratio:3/3.6;max-height:52dvh;margin:0 auto 14px}
  .swipe-card{
    position:absolute;inset:0;border-radius:26px;overflow:hidden;
    background:linear-gradient(135deg,#ffd9e3,#f7a8be);
    box-shadow:0 12px 28px rgba(74,16,36,.28);
    touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
    transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s;
    will-change:transform;
  }
  .swipe-card.dragging{transition:none;cursor:grabbing}
  .swipe-card .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7rem}
  .swipe-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
  .swipe-card .caption{
    position:absolute;left:0;right:0;bottom:0;padding:34px 14px 14px;
    background:linear-gradient(transparent,rgba(74,16,36,.88));
    color:#fff;font-size:1.25rem;font-weight:700;text-align:left;
  }
  .stamp{
    position:absolute;top:22px;padding:4px 12px;border:4px solid;border-radius:12px;
    font-weight:700;font-size:1.6rem;opacity:0;transform:rotate(-12deg);background:rgba(255,255,255,.85)
  }
  .stamp.like{left:16px;color:#e0245e;border-color:#e0245e}
  .stamp.nope{right:16px;color:#555;border-color:#555;transform:rotate(12deg)}

  .actions{display:flex;justify-content:center;gap:34px;height:76px;align-items:center;position:relative}
  .round{
    width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;font-size:30px;
    background:#fff;box-shadow:0 8px 20px rgba(123,30,58,.25);
    transition:transform .15s;display:flex;align-items:center;justify-content:center;
  }
  .round:active{transform:scale(.88)}
  #nope-btn{position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  .round.like{background:linear-gradient(135deg,#ff8fb0,var(--rosa-fuerte))}

  /* Mensaje centrado en pantalla */
  #toast{
    position:fixed;left:50%;top:50%;z-index:80;transform:translate(-50%,-40%) scale(.8);
    background:var(--vino);color:#fff;padding:16px 26px;border-radius:22px;
    font-weight:700;font-size:1.2rem;max-width:86vw;text-align:center;
    box-shadow:0 12px 30px rgba(74,16,36,.45);opacity:0;pointer-events:none;
    transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1);
  }
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  #match{
    position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(circle,rgba(255,255,255,.96) 0%,rgba(255,200,218,.97) 55%,rgba(236,111,148,.98) 100%);
    text-align:center;
  }
  #match.show{display:flex;animation:aparecer .5s ease}
  #match .box{max-width:420px}
  #match h1{font-size:clamp(2.4rem,12vw,3.6rem);color:var(--vino);text-shadow:0 0 18px #fff,0 0 36px #ff9fbe;animation:brillo 1.5s infinite alternate}
  @keyframes brillo{from{text-shadow:0 0 10px #fff,0 0 20px #ff9fbe}to{text-shadow:0 0 22px #fff,0 0 50px #ff5c8a}}
  #match p{font-size:1.25rem;margin:14px 0 26px;font-weight:700;color:var(--vino-oscuro)}

  .heart-fall{position:fixed;top:-30px;z-index:90;pointer-events:none;animation:caer linear forwards}
  @keyframes caer{to{transform:translateY(110vh) rotate(var(--rot));opacity:.9}}

  @media (max-height:640px){.stack{max-height:44dvh}.card-main{padding:16px}}
</style>
</head>
<body>

<div class="bg-hearts" id="bg-hearts"></div>
<button id="sound-btn" aria-label="Activar o pausar sonido">🔊</button>
<div id="toast"></div>

<main class="card-main">

  <section class="screen active" id="screen-welcome">
    <div class="big-emoji">💖</div>
    <h1>Nuestra Aventura de Aniversario 💖</h1>
    <p class="sub">¡Supera las pruebas para desbloquear tu sorpresa final!</p>
    <button class="btn pulse" id="start-btn">¡Empezar Aventura! 🚀</button>
  </section>

  <section class="screen" id="screen-level1">
    <span class="level-tag">Nivel 1</span>
    <h2>Tinder de Comidas 🍽️</h2>
    <div class="progress" id="progress"></div>
    <div class="stack" id="stack"></div>
    <div class="actions">
      <button class="round" id="nope-btn" aria-label="Nope">❌</button>
      <button class="round like" id="like-btn" aria-label="Like">❤️</button>
    </div>
  </section>

  <section class="screen" id="screen-level2">
    <div class="big-emoji">🔒</div>
    <h1>Nivel 2</h1>
    <p class="sub">Próximamente… 💌</p>
  </section>
</main>

<div id="match">
  <div class="box">
    <h1>¡IT'S A MATCH! 💖</h1>
    <p>Por fin una gochada que nos gusta a los dos</p>
    <button class="btn pulse" id="next-level-btn">Continuar al Nivel 2 ➡️</button>
  </div>
</div>

<script>

const MUSIC_SOURCES = ['musica.mp3', 'musica.mp3.mp3'];

   - Calabacín: U('1753445657076-5c3c710c42c4') (calabacines frescos
